id: US-10
title: Access My Info page 
as_a: User
i_want: to access the My info Page 
so_that: I can access My info settings

acceptance_criteria:
  - Given I am logged in and on the dashboard page
  - When I click on My info button on the sidebar
  - Then My info page is accessed
  - And I can see Personal Details heading
notes: |
  This story focuses on accessing on the My info page.
  The message can be seen in the Dashboard -> My info latest Posts
  Use .auth/admin.json to skip log in 