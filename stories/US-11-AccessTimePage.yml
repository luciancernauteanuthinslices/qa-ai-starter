id: US-11
title: Access Time page 
as_a: User
i_want: to access the Time Page 
so_that: I can access Time settings

acceptance_criteria:
  - Given I am logged in and on the dashboard page
  - When I click on Time button on the sidebar
  - Then Time page is accessed
  - And I can see Timesheets Pending Action section
notes: |
  This story focuses on accessing on the Time page and checks section name "Timesheets Pending Action"
  Use .auth/admin.json to skip log in 