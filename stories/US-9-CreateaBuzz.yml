id: US-9
title: Create a Buzz
as_a: User
i_want: to create a buzz message in the newsfeed
so_that: message can be seen by everyone in Dashboard -> Buzz latest Posts

acceptance_criteria:
  - Given I am logged in and on the dashboard page
  - When I click on Buzz button on the sidebar
  - Then Buzz page is accessed
  - And I write a message in the "What's on your mind?" field
  - And then click to Post to send the message 

notes: |
  This story focuses on searching functionality on the Buzz page.
  The message can be seen in the Dashboard -> Buzz latest Posts
  Use .auth/admin.json to skip log in 